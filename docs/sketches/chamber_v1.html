<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARES-VISION · Chamber Sketch v1</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: rgb(0, 5, 10);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  canvas { display: block; cursor: crosshair; }
  .hud {
    position: fixed;
    top: 14px;
    left: 16px;
    color: rgba(0, 255, 150, 0.55);
    font-size: 11px;
    line-height: 1.55;
    pointer-events: none;
    user-select: none;
  }
  .hud .title {
    color: rgba(0, 255, 150, 0.92);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .hud .dim {
    color: rgba(0, 255, 150, 0.32);
  }
  .stats {
    position: fixed;
    bottom: 14px;
    left: 16px;
    color: rgba(0, 255, 150, 0.32);
    font-size: 10px;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="title">ARES-VISION · chamber sketch v1</div>
  <div>1 detect · 2 attack · 3 tear · click chamber to pulse · <span class="dim">R reset</span></div>
</div>
<div class="stats" id="stats"></div>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const statsEl = document.getElementById('stats');

  // Layout & physics
  const SPACING = 16;
  const WALL_DEPTH = 8;
  const PADDING = 40;
  const RELAXATION_PASSES = 6;
  const DAMPING = 0.94;
  const RESTORE_K = 0.025;       // springback to rest position
  const VEL_CLAMP = 30;
  const TEAR_DIST = 90;
  const NET_COLOR = 'rgb(0, 255, 150)';
  const TEST_COLOR_RGB = '140, 230, 255';
  const BG_COLOR = 'rgb(0, 5, 10)';
  const CHAMBER_HINT_COLOR = 'rgba(0, 255, 150, 0.06)';

  // Particle SoA
  let x, y, px, py, rx, ry, pinned;
  let count = 0;

  // Sticks SoA
  let sa, sb, sactive;
  let stickCount = 0;

  // Tests
  let tests = [];

  // Chamber bounds (recomputed in build)
  let CHAMBER = null;

  // Mouse
  const mouse = { x: 0, y: 0, in: false };

  function getChamber() {
    const minDim = Math.min(canvas.width, canvas.height);
    const wallPx = WALL_DEPTH * SPACING;
    const side = Math.max(220, minDim - 2 * wallPx - 2 * PADDING);
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    return {
      cx, cy, side,
      half: side / 2,
      left: cx - side / 2,
      right: cx + side / 2,
      top: cy - side / 2,
      bottom: cy + side / 2,
    };
  }

  function build() {
    CHAMBER = getChamber();
    const wallLength = Math.max(20, Math.floor(CHAMBER.side / SPACING));
    const cols = wallLength + 1;
    const totalPerWall = cols * WALL_DEPTH;
    count = totalPerWall * 4;

    x = new Float32Array(count);
    y = new Float32Array(count);
    px = new Float32Array(count);
    py = new Float32Array(count);
    rx = new Float32Array(count);
    ry = new Float32Array(count);
    pinned = new Uint8Array(count);

    const horizPerWall = WALL_DEPTH * (cols - 1);
    const vertPerWall = (WALL_DEPTH - 1) * cols;
    stickCount = (horizPerWall + vertPerWall) * 4;
    sa = new Int32Array(stickCount);
    sb = new Int32Array(stickCount);
    sactive = new Uint8Array(stickCount);

    let pi = 0;
    let si = 0;

    // 4 walls. d=0 is the inner (chamber-facing) edge — pinned.
    // d=WALL_DEPTH-1 is the outer free edge that bows outward when pulsed.
    const sides = [
      // top
      { anchor: { x: CHAMBER.left, y: CHAMBER.top }, along: { x: 1, y: 0 }, depth: { x: 0, y: -1 } },
      // right
      { anchor: { x: CHAMBER.right, y: CHAMBER.top }, along: { x: 0, y: 1 }, depth: { x: 1, y: 0 } },
      // bottom
      { anchor: { x: CHAMBER.right, y: CHAMBER.bottom }, along: { x: -1, y: 0 }, depth: { x: 0, y: 1 } },
      // left
      { anchor: { x: CHAMBER.left, y: CHAMBER.bottom }, along: { x: 0, y: -1 }, depth: { x: -1, y: 0 } },
    ];

    for (const s of sides) {
      const startIdx = pi;
      for (let d = 0; d < WALL_DEPTH; d++) {
        for (let l = 0; l < cols; l++) {
          const x0 = s.anchor.x + s.along.x * l * SPACING + s.depth.x * d * SPACING;
          const y0 = s.anchor.y + s.along.y * l * SPACING + s.depth.y * d * SPACING;
          x[pi] = x0;
          y[pi] = y0;
          px[pi] = x0;
          py[pi] = y0;
          rx[pi] = x0;
          ry[pi] = y0;
          pinned[pi] = d === 0 ? 1 : 0;
          pi++;
        }
      }
      // sticks
      for (let d = 0; d < WALL_DEPTH; d++) {
        for (let l = 0; l < cols; l++) {
          const i = startIdx + d * cols + l;
          if (l < cols - 1) {
            sa[si] = i; sb[si] = i + 1; sactive[si] = 1; si++;
          }
          if (d < WALL_DEPTH - 1) {
            sa[si] = i; sb[si] = i + cols; sactive[si] = 1; si++;
          }
        }
      }
    }

    // Tests in the chamber
    tests = [];
    tests.push({ x: CHAMBER.cx, y: CHAMBER.cy, glow: 0, label: 'core' });
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
      tests.push({
        x: CHAMBER.cx + Math.cos(a) * CHAMBER.half * 0.45,
        y: CHAMBER.cy + Math.sin(a) * CHAMBER.half * 0.45,
        glow: 0,
        label: 't' + i,
      });
    }
  }

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    build();
  }

  // Apply an outward-radiating impulse from (sx, sy).
  // If `direction` is given, mix in a directional bias (for "attack" toward a wall).
  function pulseAt(sx, sy, opts = {}) {
    const intensity = opts.intensity ?? 1;
    const radius = opts.radius ?? (CHAMBER.half * 1.4);
    const r2 = radius * radius;
    const dir = opts.direction || null;
    const dirWeight = opts.directionWeight ?? 0.7;

    for (let i = 0; i < count; i++) {
      if (pinned[i]) continue;
      const dx0 = x[i] - sx;
      const dy0 = y[i] - sy;
      const d2 = dx0 * dx0 + dy0 * dy0;
      if (d2 > r2 || d2 < 0.01) continue;
      const d = Math.sqrt(d2);
      const falloff = Math.pow(1 - d / radius, 1.5);
      let fx, fy;
      if (dir) {
        const radX = dx0 / d, radY = dy0 / d;
        fx = radX * (1 - dirWeight) + dir.x * dirWeight;
        fy = radY * (1 - dirWeight) + dir.y * dirWeight;
      } else {
        fx = dx0 / d;
        fy = dy0 / d;
      }
      const force = intensity * 5 * falloff;
      px[i] -= fx * force;
      py[i] -= fy * force;
    }
  }

  function pickRandomTest() {
    return tests[Math.floor(Math.random() * tests.length)];
  }

  function pickRandomWallDir() {
    const dirs = [
      { x: 0, y: -1 }, { x: 1, y: 0 }, { x: 0, y: 1 }, { x: -1, y: 0 },
    ];
    return dirs[Math.floor(Math.random() * dirs.length)];
  }

  // Event vocabulary — first-pass placeholders, easy to remap to real ARES events later.
  function fireDetect() {
    const t = pickRandomTest();
    t.glow = 1;
    pulseAt(t.x, t.y, { intensity: 1, radius: CHAMBER.half * 1.4 });
  }

  function fireAttack() {
    const t = pickRandomTest();
    t.glow = 1.3;
    pulseAt(t.x, t.y, {
      intensity: 2.5,
      radius: CHAMBER.half * 1.8,
      direction: pickRandomWallDir(),
      directionWeight: 0.85,
    });
  }

  function fireTear() {
    const t = pickRandomTest();
    t.glow = 1.6;
    pulseAt(t.x, t.y, {
      intensity: 5.5,
      radius: CHAMBER.half * 2.1,
      direction: pickRandomWallDir(),
      directionWeight: 0.9,
    });
  }

  let nextAutoPulse = 0;

  function step(now) {
    // Ambient autopulse — gentle ripples so the chamber feels alive when idle.
    if (now > nextAutoPulse) {
      const t = pickRandomTest();
      t.glow = Math.max(t.glow, 0.35);
      pulseAt(t.x, t.y, { intensity: 0.35, radius: CHAMBER.half * 1.1 });
      nextAutoPulse = now + 2000 + Math.random() * 3000;
    }

    // Verlet + restore-to-rest
    for (let i = 0; i < count; i++) {
      if (pinned[i]) continue;
      let vx = (x[i] - px[i]) * DAMPING;
      let vy = (y[i] - py[i]) * DAMPING;
      vx += (rx[i] - x[i]) * RESTORE_K;
      vy += (ry[i] - y[i]) * RESTORE_K;
      if (vx > VEL_CLAMP) vx = VEL_CLAMP; else if (vx < -VEL_CLAMP) vx = -VEL_CLAMP;
      if (vy > VEL_CLAMP) vy = VEL_CLAMP; else if (vy < -VEL_CLAMP) vy = -VEL_CLAMP;
      px[i] = x[i];
      py[i] = y[i];
      x[i] += vx;
      y[i] += vy;
    }

    // Constraint relaxation
    for (let pass = 0; pass < RELAXATION_PASSES; pass++) {
      for (let k = 0; k < stickCount; k++) {
        if (!sactive[k]) continue;
        const ia = sa[k], ib = sb[k];
        const dx = x[ib] - x[ia];
        const dy = y[ib] - y[ia];
        const d = Math.hypot(dx, dy) || 0.0001;
        if (d > TEAR_DIST) { sactive[k] = 0; continue; }
        const f = (SPACING - d) / d * 0.5;
        if (!pinned[ia]) { x[ia] -= dx * f; y[ia] -= dy * f; }
        if (!pinned[ib]) { x[ib] += dx * f; y[ib] += dy * f; }
      }
    }
  }

  function draw() {
    ctx.fillStyle = BG_COLOR;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Faint chamber boundary hint
    ctx.strokeStyle = CHAMBER_HINT_COLOR;
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 6]);
    ctx.strokeRect(CHAMBER.left, CHAMBER.top, CHAMBER.side, CHAMBER.side);
    ctx.setLineDash([]);

    // Walls
    ctx.strokeStyle = NET_COLOR;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    let active = 0;
    for (let k = 0; k < stickCount; k++) {
      if (!sactive[k]) continue;
      const ia = sa[k], ib = sb[k];
      ctx.moveTo(x[ia], y[ia]);
      ctx.lineTo(x[ib], y[ib]);
      active++;
    }
    ctx.stroke();

    // Tests
    for (const t of tests) {
      const r = 4 + t.glow * 7;
      if (t.glow > 0.05) {
        const grad = ctx.createRadialGradient(t.x, t.y, r, t.x, t.y, r * 5);
        grad.addColorStop(0, `rgba(${TEST_COLOR_RGB}, ${t.glow * 0.4})`);
        grad.addColorStop(1, `rgba(${TEST_COLOR_RGB}, 0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(t.x, t.y, r * 5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = `rgba(${TEST_COLOR_RGB}, ${0.5 + t.glow * 0.5})`;
      ctx.beginPath();
      ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
      ctx.fill();
      t.glow *= 0.93;
    }

    return active;
  }

  let lastFpsTime = performance.now();
  let frames = 0;
  let fps = 0;

  function loop(now) {
    step(now);
    const active = draw();
    frames++;
    if (now - lastFpsTime >= 500) {
      fps = Math.round(frames * 1000 / (now - lastFpsTime));
      frames = 0;
      lastFpsTime = now;
      statsEl.textContent =
        `${count} nodes · ${active}/${stickCount} links · ${tests.length} tests · ${fps} fps`;
    }
    requestAnimationFrame(loop);
  }

  // Events
  window.addEventListener('resize', resize);
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    mouse.x = e.clientX - r.left;
    mouse.y = e.clientY - r.top;
    mouse.in = true;
  });
  canvas.addEventListener('mouseleave', () => { mouse.in = false; });
  canvas.addEventListener('click', () => {
    if (!mouse.in || !CHAMBER) return;
    // Only pulse from inside the chamber — keeps the metaphor honest.
    if (mouse.x < CHAMBER.left || mouse.x > CHAMBER.right ||
        mouse.y < CHAMBER.top  || mouse.y > CHAMBER.bottom) return;
    pulseAt(mouse.x, mouse.y, { intensity: 1.2, radius: CHAMBER.half * 1.4 });
    // Flash the nearest test to the click
    let nearest = 0, nearD = Infinity;
    for (let i = 0; i < tests.length; i++) {
      const dx = tests[i].x - mouse.x, dy = tests[i].y - mouse.y;
      const d = dx * dx + dy * dy;
      if (d < nearD) { nearD = d; nearest = i; }
    }
    tests[nearest].glow = 1;
  });
  window.addEventListener('keydown', e => {
    if (e.key === '1') fireDetect();
    if (e.key === '2') fireAttack();
    if (e.key === '3') fireTear();
    if (e.key === 'r' || e.key === 'R') build();
  });

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
