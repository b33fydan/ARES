<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARES-VISION · Chamber Sketch v3 (3D, stitched)</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: rgb(0, 5, 10);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  canvas { display: block; }
  .hud {
    position: fixed;
    top: 14px;
    left: 16px;
    color: rgba(0, 255, 150, 0.55);
    font-size: 11px;
    line-height: 1.55;
    pointer-events: none;
    user-select: none;
    z-index: 10;
  }
  .hud .title {
    color: rgba(0, 255, 150, 0.92);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .hud .dim {
    color: rgba(0, 255, 150, 0.32);
  }
  .stats {
    position: fixed;
    bottom: 14px;
    left: 16px;
    color: rgba(0, 255, 150, 0.32);
    font-size: 10px;
    pointer-events: none;
    user-select: none;
    z-index: 10;
  }
  .grid-readout {
    position: fixed;
    top: 14px;
    right: 16px;
    color: rgba(0, 255, 150, 0.55);
    font-size: 11px;
    line-height: 1.55;
    pointer-events: none;
    user-select: none;
    z-index: 10;
    text-align: right;
  }
  .grid-readout .big {
    color: rgba(0, 255, 150, 0.92);
    font-size: 22px;
    letter-spacing: 0.06em;
    line-height: 1;
    margin-bottom: 4px;
  }
</style>
</head>
<body>
<div class="hud">
  <div class="title">ARES-VISION · chamber sketch v3 · stitched skin</div>
  <div>1 detect · 2 attack · 3 tear · drag rotate · scroll zoom · <span class="dim">[ ] grid · A auto-rotate · R reset</span></div>
</div>
<div class="grid-readout" id="gridReadout">
  <div class="big" id="gridBig">20×20</div>
  <div id="gridSpacing">spacing —</div>
</div>
<div class="stats" id="stats"></div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Layout & physics ----------
const CUBE_SIZE = 500;
const HALF = CUBE_SIZE / 2;

const GRID_MIN = 6;
const GRID_MAX = 40;
const GRID_STEP = 2;

let GRID = 20;
let SPACING, VEL_CLAMP, TEAR_DIST;

const RELAXATION_PASSES = 6;
const DAMPING = 0.96;
const RESTORE_K = 0.018;

const NET_COLOR = 0x00ff96;
const TEST_COLOR = 0x8ce6ff;
const BG_COLOR = 0x000508;

// ---------- Three.js scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG_COLOR);

const camera = new THREE.PerspectiveCamera(
  45, window.innerWidth / window.innerHeight, 1, 5000
);
camera.position.set(900, 600, 900);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;
controls.minDistance = 400;
controls.maxDistance = 2500;

// ---------- Particle / stick storage (SoA) ----------
// Re-allocated whenever the grid changes.
let PARTICLES_PER_WALL, TOTAL_PARTICLES;
let REGULAR_STICKS_PER_WALL, TOTAL_REGULAR_STICKS;
let STITCH_STICKS_PER_EDGE, TOTAL_STITCH_STICKS, TOTAL_STICKS;

let x, y, z, px, py, pz, rx, ry, rz, pinned;
let sa, sb, srest, sactive;

function recomputeDimensions() {
  SPACING = CUBE_SIZE / (GRID - 1);
  VEL_CLAMP = SPACING * 1.5;
  TEAR_DIST = SPACING * 5.5;

  PARTICLES_PER_WALL = GRID * GRID;
  TOTAL_PARTICLES = PARTICLES_PER_WALL * 6;

  REGULAR_STICKS_PER_WALL = 2 * GRID * (GRID - 1);
  TOTAL_REGULAR_STICKS = REGULAR_STICKS_PER_WALL * 6;
  STITCH_STICKS_PER_EDGE = GRID - 2;
  TOTAL_STITCH_STICKS = STITCH_STICKS_PER_EDGE * 12;
  TOTAL_STICKS = TOTAL_REGULAR_STICKS + TOTAL_STITCH_STICKS;
}

function allocateArrays() {
  x = new Float32Array(TOTAL_PARTICLES);
  y = new Float32Array(TOTAL_PARTICLES);
  z = new Float32Array(TOTAL_PARTICLES);
  px = new Float32Array(TOTAL_PARTICLES);
  py = new Float32Array(TOTAL_PARTICLES);
  pz = new Float32Array(TOTAL_PARTICLES);
  rx = new Float32Array(TOTAL_PARTICLES);
  ry = new Float32Array(TOTAL_PARTICLES);
  rz = new Float32Array(TOTAL_PARTICLES);
  pinned = new Uint8Array(TOTAL_PARTICLES);

  sa = new Int32Array(TOTAL_STICKS);
  sb = new Int32Array(TOTAL_STICKS);
  srest = new Float32Array(TOTAL_STICKS);
  sactive = new Uint8Array(TOTAL_STICKS);
}

// ---------- Wall definitions ----------
const wallDefs = [
  { name: '+y top',    u: 'x', v: 'z', n: 'y', sign: +1 },
  { name: '-y bottom', u: 'x', v: 'z', n: 'y', sign: -1 },
  { name: '+x right',  u: 'y', v: 'z', n: 'x', sign: +1 },
  { name: '-x left',   u: 'y', v: 'z', n: 'x', sign: -1 },
  { name: '+z front',  u: 'x', v: 'y', n: 'z', sign: +1 },
  { name: '-z back',   u: 'x', v: 'y', n: 'z', sign: -1 },
];

const wallMeshes = [];

function isCorner(i, j) {
  return (i === 0 || i === GRID - 1) && (j === 0 || j === GRID - 1);
}

function buildWalls() {
  for (const wm of wallMeshes) {
    scene.remove(wm.line);
    wm.line.geometry.dispose();
    wm.line.material.dispose();
  }
  wallMeshes.length = 0;

  let pi = 0;
  let si = 0;

  for (let w = 0; w < 6; w++) {
    const def = wallDefs[w];
    const startIdx = pi;

    for (let j = 0; j < GRID; j++) {
      for (let i = 0; i < GRID; i++) {
        const uVal = -HALF + i * SPACING;
        const vVal = -HALF + j * SPACING;
        const nVal = HALF * def.sign;

        const wx = (def.u === 'x' ? uVal : (def.v === 'x' ? vVal : nVal));
        const wy = (def.u === 'y' ? uVal : (def.v === 'y' ? vVal : nVal));
        const wz = (def.u === 'z' ? uVal : (def.v === 'z' ? vVal : nVal));

        x[pi] = wx; y[pi] = wy; z[pi] = wz;
        px[pi] = wx; py[pi] = wy; pz[pi] = wz;
        rx[pi] = wx; ry[pi] = wy; rz[pi] = wz;
        pinned[pi] = isCorner(i, j) ? 1 : 0;
        pi++;
      }
    }

    for (let j = 0; j < GRID; j++) {
      for (let i = 0; i < GRID; i++) {
        const idx = startIdx + j * GRID + i;
        if (i < GRID - 1) {
          sa[si] = idx; sb[si] = idx + 1; srest[si] = SPACING; sactive[si] = 1; si++;
        }
        if (j < GRID - 1) {
          sa[si] = idx; sb[si] = idx + GRID; srest[si] = SPACING; sactive[si] = 1; si++;
        }
      }
    }

    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(REGULAR_STICKS_PER_WALL * 6);
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const material = new THREE.LineBasicMaterial({
      color: NET_COLOR,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });

    const line = new THREE.LineSegments(geometry, material);
    line.frustumCulled = false;
    scene.add(line);

    wallMeshes.push({
      def,
      line,
      stickStart: w * REGULAR_STICKS_PER_WALL,
      particleStart: startIdx,
    });
  }

  // Stitch shared edge particles between adjacent walls.
  const positionMap = new Map();
  for (let i = 0; i < TOTAL_PARTICLES; i++) {
    if (pinned[i]) continue;
    const key = rx[i].toFixed(2) + ',' + ry[i].toFixed(2) + ',' + rz[i].toFixed(2);
    let bucket = positionMap.get(key);
    if (!bucket) { bucket = []; positionMap.set(key, bucket); }
    bucket.push(i);
  }
  for (const indices of positionMap.values()) {
    if (indices.length < 2) continue;
    for (let a = 0; a < indices.length; a++) {
      for (let b = a + 1; b < indices.length; b++) {
        sa[si] = indices[a];
        sb[si] = indices[b];
        srest[si] = 0;
        sactive[si] = 1;
        si++;
      }
    }
  }
}

// ---------- Tests in chamber ----------
const tests = [];
const testMeshes = [];

function buildTests() {
  for (const m of testMeshes) {
    scene.remove(m.core);
    scene.remove(m.halo);
    m.core.geometry.dispose();
    m.core.material.dispose();
    m.halo.geometry.dispose();
    m.halo.material.dispose();
  }
  testMeshes.length = 0;
  tests.length = 0;

  tests.push({ x: 0, y: 0, z: 0, glow: 0 });
  const r = HALF * 0.45;
  const offsets = [
    [+r * 0.6, +r * 0.4, +r * 0.6],
    [-r * 0.6, +r * 0.4, -r * 0.6],
    [+r * 0.6, -r * 0.4, -r * 0.6],
    [-r * 0.6, -r * 0.4, +r * 0.6],
  ];
  for (const o of offsets) {
    tests.push({ x: o[0], y: o[1], z: o[2], glow: 0 });
  }

  for (const t of tests) {
    const coreGeom = new THREE.SphereGeometry(6, 16, 16);
    const coreMat = new THREE.MeshBasicMaterial({
      color: TEST_COLOR,
      transparent: true,
      opacity: 0.95,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    const core = new THREE.Mesh(coreGeom, coreMat);
    core.position.set(t.x, t.y, t.z);
    scene.add(core);

    const haloGeom = new THREE.SphereGeometry(20, 16, 16);
    const haloMat = new THREE.MeshBasicMaterial({
      color: TEST_COLOR,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    const halo = new THREE.Mesh(haloGeom, haloMat);
    halo.position.set(t.x, t.y, t.z);
    scene.add(halo);

    testMeshes.push({ core, halo });
  }
}

const gridBigEl = document.getElementById('gridBig');
const gridSpacingEl = document.getElementById('gridSpacing');

function updateGridReadout() {
  gridBigEl.textContent = GRID + '×' + GRID;
  gridSpacingEl.textContent = 'spacing ' + SPACING.toFixed(1) + ' · ' + TOTAL_PARTICLES + ' nodes';
}

function build() {
  recomputeDimensions();
  allocateArrays();
  buildWalls();
  buildTests();
  updateGridReadout();
}

function setGrid(newGrid) {
  GRID = Math.max(GRID_MIN, Math.min(GRID_MAX, newGrid));
  build();
}

build();

// ---------- Physics & events ----------
function pulseAt(sx, sy, sz, opts = {}) {
  const intensity = opts.intensity ?? 1;
  const radius = opts.radius ?? (HALF * 1.6);
  const r2 = radius * radius;
  const dir = opts.direction || null;
  const dirWeight = opts.directionWeight ?? 0.7;

  for (let i = 0; i < TOTAL_PARTICLES; i++) {
    if (pinned[i]) continue;
    const dx0 = x[i] - sx;
    const dy0 = y[i] - sy;
    const dz0 = z[i] - sz;
    const d2 = dx0 * dx0 + dy0 * dy0 + dz0 * dz0;
    if (d2 > r2 || d2 < 0.01) continue;
    const d = Math.sqrt(d2);
    const falloff = Math.pow(1 - d / radius, 1.5);
    let fx, fy, fz;
    if (dir) {
      const radX = dx0 / d, radY = dy0 / d, radZ = dz0 / d;
      fx = radX * (1 - dirWeight) + dir.x * dirWeight;
      fy = radY * (1 - dirWeight) + dir.y * dirWeight;
      fz = radZ * (1 - dirWeight) + dir.z * dirWeight;
    } else {
      fx = dx0 / d;
      fy = dy0 / d;
      fz = dz0 / d;
    }
    const force = intensity * 8 * falloff;
    px[i] -= fx * force;
    py[i] -= fy * force;
    pz[i] -= fz * force;
  }
}

const wallDirs = [
  { x:  0, y: +1, z:  0 },
  { x:  0, y: -1, z:  0 },
  { x: +1, y:  0, z:  0 },
  { x: -1, y:  0, z:  0 },
  { x:  0, y:  0, z: +1 },
  { x:  0, y:  0, z: -1 },
];

function pickRandomTest() {
  return tests[Math.floor(Math.random() * tests.length)];
}

function pickRandomWallDir() {
  return wallDirs[Math.floor(Math.random() * wallDirs.length)];
}

function fireDetect() {
  const t = pickRandomTest();
  t.glow = 1;
  pulseAt(t.x, t.y, t.z, { intensity: 1, radius: HALF * 1.5 });
}

function fireAttack() {
  const t = pickRandomTest();
  t.glow = 1.3;
  pulseAt(t.x, t.y, t.z, {
    intensity: 2.5,
    radius: HALF * 2.0,
    direction: pickRandomWallDir(),
    directionWeight: 0.85,
  });
}

function fireTear() {
  const t = pickRandomTest();
  t.glow = 1.6;
  pulseAt(t.x, t.y, t.z, {
    intensity: 5.5,
    radius: HALF * 2.5,
    direction: pickRandomWallDir(),
    directionWeight: 0.9,
  });
}

let nextAutoPulse = 0;

function step(now) {
  if (now > nextAutoPulse) {
    const t = pickRandomTest();
    t.glow = Math.max(t.glow, 0.3);
    pulseAt(t.x, t.y, t.z, { intensity: 0.3, radius: HALF * 1.2 });
    nextAutoPulse = now + 2000 + Math.random() * 3000;
  }

  for (let i = 0; i < TOTAL_PARTICLES; i++) {
    if (pinned[i]) continue;
    let vx = (x[i] - px[i]) * DAMPING;
    let vy = (y[i] - py[i]) * DAMPING;
    let vz = (z[i] - pz[i]) * DAMPING;
    vx += (rx[i] - x[i]) * RESTORE_K;
    vy += (ry[i] - y[i]) * RESTORE_K;
    vz += (rz[i] - z[i]) * RESTORE_K;
    if (vx > VEL_CLAMP) vx = VEL_CLAMP; else if (vx < -VEL_CLAMP) vx = -VEL_CLAMP;
    if (vy > VEL_CLAMP) vy = VEL_CLAMP; else if (vy < -VEL_CLAMP) vy = -VEL_CLAMP;
    if (vz > VEL_CLAMP) vz = VEL_CLAMP; else if (vz < -VEL_CLAMP) vz = -VEL_CLAMP;
    px[i] = x[i]; py[i] = y[i]; pz[i] = z[i];
    x[i] += vx; y[i] += vy; z[i] += vz;
  }

  for (let pass = 0; pass < RELAXATION_PASSES; pass++) {
    for (let k = 0; k < TOTAL_STICKS; k++) {
      if (!sactive[k]) continue;
      const ia = sa[k], ib = sb[k];
      const dx = x[ib] - x[ia];
      const dy = y[ib] - y[ia];
      const dz = z[ib] - z[ia];
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz) || 0.0001;
      const rest = srest[k];
      if (rest > 0 && d > TEAR_DIST) { sactive[k] = 0; continue; }
      const f = (rest - d) / d * 0.5;
      if (!pinned[ia]) { x[ia] -= dx * f; y[ia] -= dy * f; z[ia] -= dz * f; }
      if (!pinned[ib]) { x[ib] += dx * f; y[ib] += dy * f; z[ib] += dz * f; }
    }
  }
}

function updateGeometry() {
  let totalActive = 0;
  for (let w = 0; w < 6; w++) {
    const wm = wallMeshes[w];
    const positions = wm.line.geometry.attributes.position.array;
    let ptr = 0;
    const stickStart = w * REGULAR_STICKS_PER_WALL;
    const stickEnd = stickStart + REGULAR_STICKS_PER_WALL;
    for (let k = stickStart; k < stickEnd; k++) {
      if (!sactive[k]) {
        positions[ptr++] = 0; positions[ptr++] = 0; positions[ptr++] = 0;
        positions[ptr++] = 0; positions[ptr++] = 0; positions[ptr++] = 0;
        continue;
      }
      const ia = sa[k], ib = sb[k];
      positions[ptr++] = x[ia]; positions[ptr++] = y[ia]; positions[ptr++] = z[ia];
      positions[ptr++] = x[ib]; positions[ptr++] = y[ib]; positions[ptr++] = z[ib];
      totalActive++;
    }
    wm.line.geometry.attributes.position.needsUpdate = true;
  }
  return totalActive;
}

function updateTests() {
  for (let i = 0; i < tests.length; i++) {
    const t = tests[i];
    const m = testMeshes[i];
    const scale = 1 + t.glow * 1.2;
    m.core.scale.setScalar(scale);
    m.halo.scale.setScalar(0.5 + t.glow * 2.5);
    m.halo.material.opacity = t.glow * 0.4;
    m.core.material.opacity = 0.5 + t.glow * 0.5;
    t.glow *= 0.93;
  }
}

// ---------- Loop ----------
const statsEl = document.getElementById('stats');
let lastFpsTime = performance.now();
let frames = 0;
let fps = 0;

function animate(now) {
  step(now);
  const active = updateGeometry();
  updateTests();
  controls.update();
  renderer.render(scene, camera);
  frames++;
  if (now - lastFpsTime >= 500) {
    fps = Math.round(frames * 1000 / (now - lastFpsTime));
    frames = 0;
    lastFpsTime = now;
    statsEl.textContent =
      'GRID ' + GRID + '×' + GRID + ' · ' + TOTAL_PARTICLES + ' nodes · ' +
      active + '/' + TOTAL_REGULAR_STICKS + ' links · ' +
      TOTAL_STITCH_STICKS + ' stitches · ' + fps + ' fps';
  }
  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

// ---------- Events ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

window.addEventListener('keydown', e => {
  if (e.key === '1') fireDetect();
  if (e.key === '2') fireAttack();
  if (e.key === '3') fireTear();
  if (e.key === 'r' || e.key === 'R') build();
  if (e.key === 'a' || e.key === 'A') controls.autoRotate = !controls.autoRotate;
  if (e.key === '[') setGrid(GRID - GRID_STEP);
  if (e.key === ']') setGrid(GRID + GRID_STEP);
});

renderer.domElement.addEventListener('dblclick', () => {
  fireDetect();
});
</script>
</body>
</html>
