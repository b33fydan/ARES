name: tests

# Zero-regression gate. Runs the full suite (tests + ares) on every push so the
# "remember to run pytest before merge" discipline is enforced automatically
# rather than by hand.
#
# Notes:
#  - testpaths in pyproject.toml is ["tests"] (~417 tests); the full suite lives
#    across `tests` + `ares`, so both are passed explicitly here.
#  - Live-LLM tests are marked @pytest.mark.live_llm and skipped unless
#    --run-live-llm is passed, so CI needs no API keys and makes no API calls.
#  - Runs on windows-latest to match the dev/test environment — the SHA256
#    byte-stability anchors and line-ending assumptions are validated against
#    Windows checkouts.

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run full test suite (tests + ares)
        run: pytest tests ares
